name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_eval:
        description: Run evaluation harness (costs Azure OpenAI tokens)
        type: boolean
        default: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: uclrag
          POSTGRES_USER: uclrag
          POSTGRES_PASSWORD: uclrag
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore ucl-rag.slnx

      - name: Build
        run: dotnet build ucl-rag.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test src/Api.Tests/Api.Tests.csproj --no-build --configuration Release
        env:
          ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=uclrag;Username=uclrag;Password=uclrag

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

  eval:
    if: github.event_name == 'workflow_dispatch' && inputs.run_eval == true
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build eval harness
        run: dotnet build src/Eval/Eval.csproj --configuration Release

      - name: Run eval
        run: dotnet run --project src/Eval/Eval.csproj --no-build --configuration Release
        env:
          Eval__ApiBaseUrl: ${{ secrets.API_BASE_URL }}
